<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>보험 상담 정보 입력</title>
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--primary:#1e40af;--primary-bg:#eff6ff;
  --danger:#ef4444;--success:#10b981;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--subtle:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.top{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;padding:22px 18px 26px}
.top h1{font-size:1.15rem;font-weight:700}
.top p{font-size:.86rem;opacity:.85;margin-top:4px}
.wrap{max-width:560px;margin:-14px auto 0;padding:0 14px 40px}
.card{background:var(--surface);border-radius:14px;padding:18px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:.95rem;color:var(--primary);margin-bottom:12px}
.fg{margin-bottom:14px}
.fg:last-child{margin-bottom:0}
label.l{display:block;font-size:.84rem;font-weight:600;margin-bottom:5px}
label.l .req{color:var(--danger);margin-left:2px}
.hint{font-size:.76rem;color:var(--muted);margin-top:4px}
input[type=text],input[type=tel],input[type=email],input[type=number],textarea,select{
  width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1;min-width:0}
.row .dash{flex:0 0 auto;color:var(--subtle)}
.err{border-color:var(--danger)!important}
.consent{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;font-size:.8rem;color:var(--muted);background:#f8fafc}
.consent b{color:var(--text)}
.consent table{width:100%;border-collapse:collapse;margin:6px 0}
.consent td{padding:3px 0;vertical-align:top}
.consent td:first-child{width:72px;color:var(--text);font-weight:600}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;font-weight:600;color:var(--text);margin-top:8px;cursor:pointer}
.chk input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--primary)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:disabled{opacity:.5}
.btn-ghost{background:none;border:1px dashed #93c5fd;color:var(--primary);padding:9px;font-size:.85rem;border-radius:9px;width:100%;cursor:pointer;font-family:inherit}
.q{padding:14px 0;border-bottom:1px solid var(--border)}
.q:first-of-type{padding-top:2px}
.q:last-child{border-bottom:none;padding-bottom:0}
.q-text{font-size:.9rem;font-weight:600}
.q-text .no{color:var(--primary);margin-right:4px}
.q-sub{font-size:.78rem;color:var(--muted);margin-top:3px}
.yn{display:flex;gap:8px;margin-top:10px}
.yn label{flex:1;text-align:center;padding:10px;border:1px solid var(--border);border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;user-select:none}
.yn input{display:none}
.yn input:checked + span{color:#fff}
.yn label:has(input:checked){background:var(--primary);border-color:var(--primary);color:#fff}
.yn label.yes:has(input:checked){background:#dc2626;border-color:#dc2626}
.q.missing .yn label{border-color:var(--danger)}
.details{margin-top:10px;display:none}
.details.show{display:block}
.drow{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;margin-bottom:8px;position:relative}
.drow .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.drow .grid .full{grid-column:1/-1}
.drow input,.drow select{padding:9px 10px;font-size:15px}
.drow .del{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{padding:7px 11px;border:1px solid var(--border);border-radius:99px;font-size:.82rem;cursor:pointer}
.chips input{display:none}
.chips label:has(input:checked){background:#fee2e2;border-color:#f87171;color:#991b1b;font-weight:600}
.sig-box{border:1.5px dashed #93c5fd;border-radius:10px;background:#fff;position:relative;touch-action:none}
.sig-box canvas{display:block;width:100%;height:160px;border-radius:10px}
.sig-box .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--subtle);font-size:.85rem;pointer-events:none}
.sig-clear{background:none;border:none;color:var(--muted);font-size:.8rem;text-decoration:underline;cursor:pointer;margin-top:4px}
.notice{background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:11px 12px;font-size:.8rem;color:#713f12;margin-bottom:12px}
.center{text-align:center;padding:40px 10px}
.center .ico{font-size:3rem;margin-bottom:10px}
.center h2{font-size:1.1rem;margin-bottom:6px;color:var(--text)}
.center p{font-size:.9rem;color:var(--muted)}
.receipt{display:inline-block;margin-top:14px;background:var(--primary-bg);color:var(--primary);font-family:ui-monospace,Menlo,monospace;padding:8px 14px;border-radius:8px;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:10px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:99}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="top">
  <h1 id="pageTitle">보험 상담 정보 입력</h1>
  <p id="pageSub">불러오는 중...</p>
</div>

<div class="wrap" id="app">
  <div class="card center"><div class="ico">⏳</div><p>링크를 확인하고 있습니다...</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL      = 'https://cqzaubldothptphbkech.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxemF1Ymxkb3RocHRwaGJrZWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0OTk2MzgsImV4cCI6MjA4NzA3NTYzOH0.uUa9h9HoESZnxTLP70I33_AVGuu7gk5Ca3hpSSrNzHw';
const FORM_VERSION = '2026-10-v1';

const TOKEN = new URLSearchParams(location.search).get('t') || '';
let INFO = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

async function rpc(fn, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
    body: JSON.stringify(body)
  });
  const txt = await res.text();
  const json = txt ? JSON.parse(txt) : null;
  if(!res.ok) throw new Error((json && (json.message||json.hint)) || ('HTTP '+res.status));
  return json;
}

function showMessage(ico, title, msg){
  $('app').innerHTML = `<div class="card center"><div class="ico">${ico}</div><h2>${esc(title)}</h2><p>${msg}</p></div>`;
}
const REASON = {
  invalid: ['🔗','올바르지 않은 링크입니다','받으신 링크 주소가 정확한지 확인하시거나, 담당 설계사에게 다시 요청해 주세요.'],
  used:    ['✅','이미 제출이 완료된 링크입니다','수정할 내용이 있으시면 담당 설계사에게 새 링크를 요청해 주세요.'],
  expired: ['⌛','유효기간이 지난 링크입니다','담당 설계사에게 새 링크를 요청해 주세요.']
};

// ── 시작 ──────────────────────────────────────────────────────
(async function init(){
  if(!/^[A-Za-z0-9_-]{20,64}$/.test(TOKEN)){ $('pageSub').textContent=''; return showMessage(...REASON.invalid); }
  try{
    INFO = await rpc('get_intake', {p_token: TOKEN});
  }catch(e){
    $('pageSub').textContent='';
    return showMessage('⚠️','연결에 실패했습니다','잠시 후 다시 열어 주세요.<br><small>'+esc(e.message)+'</small>');
  }
  if(!INFO || !INFO.ok){ $('pageSub').textContent=''; return showMessage(...(REASON[INFO&&INFO.reason]||REASON.invalid)); }

  const who = INFO.customer_name ? `${INFO.customer_name} 님` : '고객님';
  const agent = INFO.agent_name ? ` · 담당 ${INFO.agent_name}` : '';
  const until = new Date(INFO.expires_at).toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
  if(INFO.kind === 'medical'){
    document.title = '건강 상태 사전 확인서';
    $('pageTitle').textContent = '🩺 건강 상태 사전 확인서';
  } else {
    $('pageTitle').textContent = '📝 보험 상담 기본정보 입력';
  }
  $('pageSub').textContent = `${who}${agent} · ${until}까지 1회 제출 가능`;
  INFO.kind === 'medical' ? renderMedical() : renderBasic();
})();

// ══════════════════════════════════════════════════════════════
//  1단계: 기본정보
// ══════════════════════════════════════════════════════════════
function renderBasic(){
  $('app').innerHTML = `
  <div class="card">
    <h2>기본 정보</h2>
    <div class="fg"><label class="l">이름<span class="req">*</span></label>
      <input type="text" id="b-name" autocomplete="name" value="${esc(INFO.customer_name||'')}"></div>
    <div class="fg"><label class="l">주민등록번호<span class="req">*</span></label>
      <div class="row">
        <input type="tel" id="b-ssn1" maxlength="6" inputmode="numeric" placeholder="앞 6자리" autocomplete="off">
        <span class="dash">-</span>
        <input type="tel" id="b-ssn2" maxlength="7" inputmode="numeric" placeholder="뒤 7자리" autocomplete="off" style="-webkit-text-security:disc">
      </div>
      <div class="hint">보험 설계·청약 진행에만 사용됩니다.</div></div>
    <div class="fg"><label class="l">휴대폰 번호<span class="req">*</span></label>
      <input type="tel" id="b-phone" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel" oninput="fmtPhone(this)"></div>
    <div class="fg"><label class="l">이메일</label>
      <input type="email" id="b-email" autocomplete="email" placeholder="선택"></div>
    <div class="fg"><label class="l">주소<span class="req">*</span></label>
      <input type="text" id="b-address" autocomplete="street-address" placeholder="시/구/동 및 상세주소"></div>
    <div class="fg"><label class="l">직업<span class="req">*</span></label>
      <input type="text" id="b-job" placeholder="예: 회사원(사무직), 자영업(음식점), 주부"></div>
    <div class="fg"><label class="l">직장명 / 하는 일</label>
      <input type="text" id="b-jobDetail" placeholder="선택 · 예: OO물산 경리, 화물차 운전"></div>
  </div>

  <div class="card">
    <h2>개인정보 동의</h2>
    <div class="consent">
      <b>[필수] 개인정보 수집·이용 동의</b>
      <table>
        <tr><td>수집 항목</td><td>이름, 휴대폰 번호, 이메일, 주소, 직업</td></tr>
        <tr><td>이용 목적</td><td>보험 상담, 보장 분석, 보험 계약 체결·유지 안내</td></tr>
        <tr><td>보유 기간</td><td>상담 종료 또는 계약 종료 후 5년 (요청 시 즉시 파기)</td></tr>
      </table>
      동의를 거부할 수 있으나, 거부 시 상담 진행이 어렵습니다.
      <label class="chk"><input type="checkbox" id="c-privacy">위 내용에 동의합니다</label>
    </div>
    <div class="consent">
      <b>[필수] 고유식별정보(주민등록번호) 처리 동의</b>
      <table>
        <tr><td>처리 항목</td><td>주민등록번호</td></tr>
        <tr><td>이용 목적</td><td>보험료 산출, 청약서 작성 등 보험 계약 체결 절차</td></tr>
        <tr><td>보유 기간</td><td>위와 동일</td></tr>
      </table>
      <label class="chk"><input type="checkbox" id="c-unique">위 내용에 동의합니다</label>
    </div>
  </div>

  <button class="btn btn-primary" id="submitBtn" onclick="submitBasic()">제출하기</button>`;
  ['b-ssn1','b-ssn2'].forEach(id=>$(id).addEventListener('input',e=>{
    e.target.value=e.target.value.replace(/\D/g,'');
    if(id==='b-ssn1' && e.target.value.length===6) $('b-ssn2').focus();
  }));
}

function fmtPhone(el){
  const d=el.value.replace(/\D/g,'').slice(0,11);
  el.value = d.length<4?d : d.length<8?d.slice(0,3)+'-'+d.slice(3) : d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);
}
function validSsn(a,b){
  if(!/^\d{6}$/.test(a)||!/^\d{7}$/.test(b)) return false;
  const mm=+a.slice(2,4), dd=+a.slice(4,6);
  return mm>=1&&mm<=12&&dd>=1&&dd<=31&&/[1-8]/.test(b[0]);
}

async function submitBasic(){
  const g=id=>$(id).value.trim();
  document.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));
  const need=[['b-name','이름'],['b-phone','휴대폰 번호'],['b-address','주소'],['b-job','직업']];
  for(const [id,lbl] of need){ if(!g(id)){ $(id).classList.add('err'); $(id).focus(); return toast(lbl+'을(를) 입력해 주세요'); } }
  if(!validSsn(g('b-ssn1'),g('b-ssn2'))){ $('b-ssn1').classList.add('err'); $('b-ssn2').classList.add('err'); return toast('주민등록번호를 확인해 주세요'); }
  if(g('b-phone').replace(/\D/g,'').length<10){ $('b-phone').classList.add('err'); return toast('휴대폰 번호를 확인해 주세요'); }
  if(!$('c-privacy').checked || !$('c-unique').checked) return toast('필수 동의 항목에 체크해 주세요');

  const data = {
    form:'basic', version:FORM_VERSION,
    name:g('b-name'), ssn1:g('b-ssn1'), ssn2:g('b-ssn2'), phone:g('b-phone'),
    email:g('b-email'), address:g('b-address'), job:g('b-job'), jobDetail:g('b-jobDetail')
  };
  const meta = baseMeta([
    ['privacy','개인정보 수집·이용 동의(필수)'],
    ['unique_id','고유식별정보(주민등록번호) 처리 동의(필수)']
  ]);
  await doSubmit(data, meta);
}

// ══════════════════════════════════════════════════════════════
//  2단계: 병력설문 (건강 상태 사전 확인서)
// ══════════════════════════════════════════════════════════════
const MAJOR = ['암','백혈병','고혈압','협심증','심근경색','심장판막증','간경화증','뇌졸중(뇌출혈·뇌경색)','당뇨병','에이즈·HIV 보균'];
const QUESTIONS = [
  {id:'m3', text:'최근 3개월 이내에 의사로부터 진찰 또는 검사를 통해 아래 의료행위를 받은 적이 있습니까?',
   sub:'질병 확정진단, 질병 의심소견, 치료, 입원, 수술, 투약', detail:true},
  {id:'m3drug', text:'최근 3개월 이내에 혈압약, 신경안정제, 수면제, 진통제 등 약을 계속 복용한 적이 있습니까?',
   sub:'영양제·비타민은 제외', detail:true},
  {id:'y1', text:'최근 1년 이내에 건강검진 등에서 추가검사(재검사)를 받은 적이 있습니까?', detail:true},
  {id:'y5', text:'최근 5년 이내에 아래 의료행위를 받은 적이 있습니까?',
   sub:'입원, 수술(제왕절개 포함), 계속하여 7일 이상 치료, 계속하여 30일 이상 투약', detail:true},
  {id:'y5major', text:'최근 5년 이내에 아래 질병으로 진단·치료·입원·수술·투약을 받은 적이 있습니까?',
   sub:'해당하는 질병을 모두 선택해 주세요', major:true, detail:true},
  {id:'bp', text:'현재 고혈압약을 복용하고 있습니까?', detail:true},
  {id:'dm', text:'당뇨 또는 당뇨 전단계로 진단받거나 약을 복용한 적이 있습니까?', detail:true},
  {id:'surgery', text:'기간과 관계없이 지금까지 수술이나 시술을 받은 적이 있습니까?', sub:'내시경 용종 제거, 레이저 시술 등 포함', detail:true},
  {id:'disab', text:'현재 시력·청력·언어 등의 장애나 팔·다리·척추 등에 손실 또는 변형으로 인한 장애가 있습니까?', detail:true},
  {id:'preg', text:'현재 임신 중입니까?', sub:'해당하지 않으면 "아니오"', detail:false}
];

function renderMedical(){
  $('app').innerHTML = `
  <div class="notice">
    정확한 보장 설계를 위한 <b>사전 확인서</b>입니다. 사실과 다르게 작성하면 나중에 보험금 지급이 거절되거나 계약이 해지될 수 있으니,
    기억나는 대로 빠짐없이 적어 주세요. 실제 가입 시에는 보험회사 청약서의 <b>계약 전 알릴 의무</b> 항목에도 같은 내용으로 답하셔야 합니다.
  </div>

  <div class="card">
    <h2>본인 확인</h2>
    <div class="row">
      <div class="fg"><label class="l">성명<span class="req">*</span></label><input type="text" id="m-name" value="${esc(INFO.customer_name||'')}"></div>
      <div class="fg"><label class="l">생년월일<span class="req">*</span></label><input type="tel" id="m-birth" maxlength="6" inputmode="numeric" placeholder="예: 800515"></div>
    </div>
  </div>

  <div class="card">
    <h2>건강 상태 질문</h2>
    ${QUESTIONS.map((q,i)=>`
      <div class="q" id="q-${q.id}">
        <div class="q-text"><span class="no">${i+1}.</span>${esc(q.text)}</div>
        ${q.sub?`<div class="q-sub">${esc(q.sub)}</div>`:''}
        <div class="yn">
          <label class="no"><input type="radio" name="a-${q.id}" value="아니오" onchange="onYN('${q.id}')"><span>아니오</span></label>
          <label class="yes"><input type="radio" name="a-${q.id}" value="예" onchange="onYN('${q.id}')"><span>예</span></label>
        </div>
        ${q.major?`<div class="details" id="mj-${q.id}"><div class="chips">${MAJOR.map(m=>`<label><input type="checkbox" value="${esc(m)}">${esc(m)}</label>`).join('')}</div></div>`:''}
        ${q.detail?`<div class="details" id="d-${q.id}">
          <div id="dl-${q.id}"></div>
          <button type="button" class="btn-ghost" onclick="addDetail('${q.id}')">+ 내용 추가</button>
        </div>`:''}
      </div>`).join('')}
  </div>

  <div class="card">
    <h2>생활 습관 · 복용 약</h2>
    <div class="fg"><label class="l">현재 복용 중인 약<span class="req">*</span></label>
      <input type="text" id="x-meds" placeholder="약 이름 또는 용도 (없으면 '없음')"></div>
    <div class="row">
      <div class="fg"><label class="l">흡연</label>
        <select id="x-smoke"><option value="">선택</option><option>비흡연</option><option>과거 흡연(금연)</option><option>현재 흡연</option></select></div>
      <div class="fg"><label class="l">음주</label>
        <select id="x-drink"><option value="">선택</option><option>안 마심</option><option>월 1~2회</option><option>주 1~2회</option><option>주 3회 이상</option></select></div>
    </div>
    <div class="row">
      <div class="fg"><label class="l">키(cm)</label><input type="number" id="x-height" inputmode="decimal" placeholder="선택"></div>
      <div class="fg"><label class="l">몸무게(kg)</label><input type="number" id="x-weight" inputmode="decimal" placeholder="선택"></div>
    </div>
  </div>

  <div class="card">
    <h2>동의 및 서명</h2>
    <div class="consent">
      <b>[필수] 민감정보(건강정보) 수집·이용 동의</b>
      <table>
        <tr><td>수집 항목</td><td>병력, 진료·투약 이력, 장애 여부, 임신 여부, 흡연·음주, 키·몸무게, 서명</td></tr>
        <tr><td>이용 목적</td><td>보험 가입 가능 여부 확인, 보장 설계, 청약 시 고지사항 안내 및 기록 보관</td></tr>
        <tr><td>보유 기간</td><td>보험 계약 종료 후 5년 (계약 미체결 시 상담 종료 후 1년)</td></tr>
      </table>
      동의를 거부할 수 있으나, 거부 시 보장 설계가 어렵습니다.
      <label class="chk"><input type="checkbox" id="c-health">위 내용에 동의합니다</label>
    </div>
    <div class="consent">
      <b>[필수] 작성 확인</b><br>
      본인은 위 질문에 대해 직접, 사실대로 빠짐없이 답하였으며, 이 확인서가 상담 기록으로 보관되는 것에 동의합니다.
      <label class="chk"><input type="checkbox" id="c-truth">확인합니다</label>
    </div>
    <div class="fg"><label class="l">서명<span class="req">*</span></label>
      <div class="sig-box"><canvas id="sig"></canvas><div class="ph" id="sigPh">여기에 손가락으로 서명해 주세요</div></div>
      <button type="button" class="sig-clear" onclick="clearSig()">다시 쓰기</button>
    </div>
  </div>

  <button class="btn btn-primary" id="submitBtn" onclick="submitMedical()">제출하기</button>`;
  $('m-birth').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
  setupSig();
}

function onYN(id){
  const q=QUESTIONS.find(x=>x.id===id);
  const v=(document.querySelector(`input[name="a-${id}"]:checked`)||{}).value;
  $('q-'+id).classList.remove('missing');
  const yes = v==='예';
  if(q.major) $('mj-'+id).classList.toggle('show', yes);
  if(q.detail){
    $('d-'+id).classList.toggle('show', yes);
    if(yes && !$('dl-'+id).children.length) addDetail(id);
  }
}

function addDetail(id){
  const box=$('dl-'+id);
  const div=document.createElement('div');
  div.className='drow';
  div.innerHTML=`
    <button type="button" class="del" onclick="this.parentElement.remove()" aria-label="삭제">✕</button>
    <div class="grid">
      <input class="full" data-k="disease" placeholder="병명 또는 증상 *">
      <input data-k="when" placeholder="시기 (예: 2024년 3월)">
      <input data-k="hospital" placeholder="병원명">
      <select data-k="treat"><option value="">치료 내용</option><option>통원</option><option>투약</option><option>입원</option><option>수술</option><option>검사/재검사</option></select>
      <select data-k="state"><option value="">현재 상태</option><option>완치</option><option>치료 중</option><option>경과 관찰</option></select>
      <input class="full" data-k="note" placeholder="추가 설명 (입원 일수, 약 이름 등)">
    </div>`;
  box.appendChild(div);
}

// ── 서명 패드 ────────────────────────────────────────────────
let sigCtx, sigDrawn=false;
function setupSig(){
  const c=$('sig');
  const ratio=window.devicePixelRatio||1;
  const w=c.offsetWidth, h=c.offsetHeight;
  c.width=w*ratio; c.height=h*ratio;
  sigCtx=c.getContext('2d');
  sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.4; sigCtx.lineCap='round'; sigCtx.lineJoin='round'; sigCtx.strokeStyle='#0f172a';
  let drawing=false;
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);});
  c.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();if(!sigDrawn){sigDrawn=true;$('sigPh').classList.add('hidden');}});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,()=>drawing=false));
}
function clearSig(){
  const c=$('sig'); sigCtx.save(); sigCtx.setTransform(1,0,0,1,0,0); sigCtx.clearRect(0,0,c.width,c.height); sigCtx.restore();
  sigDrawn=false; $('sigPh').classList.remove('hidden');
}
function sigPng(){
  // 용량을 줄이기 위해 최대 폭 480px로 축소
  const src=$('sig'); const scale=Math.min(1,480/src.width);
  const t=document.createElement('canvas'); t.width=Math.round(src.width*scale); t.height=Math.round(src.height*scale);
  const x=t.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,t.width,t.height); x.drawImage(src,0,0,t.width,t.height);
  return t.toDataURL('image/png');
}

async function submitMedical(){
  const name=$('m-name').value.trim(), birth=$('m-birth').value.trim();
  if(!name){ $('m-name').classList.add('err'); return toast('성명을 입력해 주세요'); }
  if(!/^\d{6}$/.test(birth)){ $('m-birth').classList.add('err'); return toast('생년월일 6자리를 입력해 주세요'); }

  const answers=[];
  for(let i=0;i<QUESTIONS.length;i++){
    const q=QUESTIONS[i];
    const v=(document.querySelector(`input[name="a-${q.id}"]:checked`)||{}).value;
    if(!v){ const el=$('q-'+q.id); el.classList.add('missing'); el.scrollIntoView({behavior:'smooth',block:'center'}); return toast(`${i+1}번 질문에 답해 주세요`); }
    const a={no:i+1,id:q.id,q:q.text+(q.sub?` (${q.sub})`:''),a:v};
    if(v==='예'){
      if(q.major){
        a.diseases=[...$('mj-'+q.id).querySelectorAll('input:checked')].map(x=>x.value);
        if(!a.diseases.length){ $('q-'+q.id).scrollIntoView({behavior:'smooth',block:'center'}); return toast(`${i+1}번: 해당 질병을 선택해 주세요`); }
      }
      if(q.detail){
        a.details=[...$('dl-'+q.id).querySelectorAll('.drow')].map(r=>{
          const o={}; r.querySelectorAll('[data-k]').forEach(f=>o[f.dataset.k]=f.value.trim()); return o;
        }).filter(o=>Object.values(o).some(Boolean));
        if(!a.details.length || a.details.some(d=>!d.disease)){ $('q-'+q.id).scrollIntoView({behavior:'smooth',block:'center'}); return toast(`${i+1}번: 병명 또는 증상을 적어 주세요`); }
      }
    }
    answers.push(a);
  }
  const meds=$('x-meds').value.trim();
  if(!meds){ $('x-meds').classList.add('err'); $('x-meds').focus(); return toast('복용 중인 약을 적어 주세요 (없으면 "없음")'); }
  if(!$('c-health').checked || !$('c-truth').checked) return toast('필수 동의 및 확인에 체크해 주세요');
  if(!sigDrawn) return toast('서명을 해 주세요');

  const data = {
    form:'medical', version:FORM_VERSION,
    respondent:{name, birth6:birth},
    answers,
    lifestyle:{meds, smoke:$('x-smoke').value, drink:$('x-drink').value, height:$('x-height').value, weight:$('x-weight').value},
    pledge:'본인은 위 질문에 대해 직접, 사실대로 빠짐없이 답하였으며, 이 확인서가 상담 기록으로 보관되는 것에 동의합니다.',
    signature:sigPng()
  };
  const meta = baseMeta([
    ['health','민감정보(건강정보) 수집·이용 동의(필수)'],
    ['truth','작성 확인(필수)']
  ]);
  await doSubmit(data, meta);
}

// ── 공통 제출 ────────────────────────────────────────────────
function baseMeta(consents){
  const now=new Date().toISOString();
  return {
    consents: consents.map(([id,text])=>({id,text,agreed:true,at:now})),
    client_time: now,
    user_agent: navigator.userAgent,
    screen: `${screen.width}x${screen.height}`,
    lang: navigator.language
  };
}

async function doSubmit(data, meta){
  const btn=$('submitBtn');
  if(!confirm('입력하신 내용으로 제출할까요?\n제출 후에는 수정할 수 없습니다.')) return;
  btn.disabled=true; btn.textContent='제출 중...';
  try{
    const r = await rpc('submit_intake', {p_token:TOKEN, p_data:data, p_meta:meta});
    if(!r || !r.ok){
      if(r && REASON[r.reason]) return showMessage(...REASON[r.reason]);
      throw new Error(r && r.reason || '알 수 없는 오류');
    }
    const at=new Date(r.submitted_at).toLocaleString('ko-KR');
    window.scrollTo(0,0);
    showMessage('🎉','제출이 완료되었습니다',
      `담당 설계사에게 안전하게 전달되었습니다.<br>감사합니다.<br><span class="receipt">접수번호 ${esc(r.receipt)}<br>${esc(at)}</span>`);
  }catch(e){
    btn.disabled=false; btn.textContent='제출하기';
    toast('제출에 실패했습니다. 다시 시도해 주세요. ('+e.message+')');
  }
}
</script>
